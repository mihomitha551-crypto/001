<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central de Consulta</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

body{
font-family:'Inter',sans-serif;
background:linear-gradient(180deg,#0a0f1c,#05070d);
color:white;
}

/* fundo leve */

.bg-soft{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;

background:
radial-gradient(circle at 20% 30%, rgba(0,120,255,0.08), transparent),
radial-gradient(circle at 80% 70%, rgba(0,200,255,0.05), transparent);

z-index:-1;
}

/* card */

.card{
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border-radius:16px;
}

/* botão */

.btn{
background:#1d4ed8;
border-radius:10px;
font-weight:600;
transition:.3s;
}

.btn:hover{
background:#2563eb;
}

/* texto destaque */

.highlight{
color:#60a5fa;
}

.small{
font-size:12px;
color:#9ca3af;
}

</style>
</head>

<body class="min-h-screen flex flex-col">

<div class="bg-soft"></div>

<!-- HEADER -->
<header class="p-6 flex justify-between items-center max-w-6xl mx-auto w-full">

<h1 class="text-lg font-bold">
Central de Consulta
</h1>

<span class="text-green-400 text-xs">
Sistema Online
</span>

</header>

<!-- MAIN -->
<main class="flex-grow flex items-center justify-center p-6">

<div class="max-w-xl w-full">

<div class="card p-10 text-center">

<h2 class="text-3xl font-bold mb-4">
Acesse sua área personalizada
</h2>

<p class="text-gray-300 mb-8">
Utilize nosso sistema para verificar informações e condições disponíveis de forma rápida e segura.
</p>

<a href="https://inkacessovipmegafeirao.github.io/feirao/inicio/"
class="btn w-full py-4 text-center text-white block">

Continuar

</a>

<p class="small mt-6">
Este site é uma plataforma informativa. Os resultados podem variar de acordo com análise individual.
</p>

</div>

</div>

</main>

</body>
</html>
